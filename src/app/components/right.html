<section class="col-lg-8 p-4 right">
    <div class="header mb-4 border-bottom pb-3">
        <h1 class="header_title display-3 fw-bolder" id="personName">Loading <span class="text-secondary">Data...</span></h1>
        <p class="header__text lead text-uppercase text-secondary">Loading...</p>
    </div>

    <div class="aboutme mb-4">
        <div class="d-flex justify-content-between align-items-center cursor-pointer">
            <h3 class="left_title roll text-uppercase fs-4 mb-3 pb-2">Про мене</h3>
            <i class="bi bi-chevron-up text-primary fs-4 toggle-icon" data-target="about-me-content"></i>
        </div>
        <div class="roll-block is-open" id="about-me-content">
            <p class="aboutme_text">Loading about me...</p>
        </div>
    </div>

    <div class="education mb-4">
        <div class="d-flex justify-content-between align-items-center cursor-pointer">
            <h3 class="left_title roll text-uppercase fs-4 mb-3 pb-2">Освіта</h3>
            <i class="bi bi-chevron-up text-primary fs-4 toggle-icon" data-target="education-content"></i>
        </div>

        <div class="education_list roll-block is-open" id="education-content">
            <div class="card education_card mb-3 shadow-sm border-start border-5 border-primary">
                <div class="card-body p-3">
                    <h4 class="card-title education_card__title fw-bold fs-5">Loading Education...</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="experience mb-4">
        <div class="d-flex justify-content-between align-items-center cursor-pointer">
            <h3 class="left_title roll text-uppercase fs-4 mb-3 pb-2">Досвід</h3>
            <i class="bi bi-chevron-up text-primary fs-4 toggle-icon" data-target="experience-content"></i>
        </div>

        <div class="experience_list roll-block is-open" id="experience-content">
            <div class="card experience_card mb-3 shadow-sm border-start border-5 border-success">
                <div class="card-body p-3">
                    <h4 class="card-title experience_card__title fw-bold fs-5">Loading Experience...</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="expertise">
        <h3 class="left_title text-uppercase fs-4 mb-3 border-bottom pb-2">Експертиза</h3>
        <div class="row row-cols-2 row-cols-md-4 g-4 expertise__items text-center">

            <div class="col expertise__item">
                <div class="circular-progress" style="--p:85%">
                    <div class="text-content">Adobe<br>Photoshop</div>
                </div>
            </div>

            <div class="col expertise__item">
                <div class="circular-progress" style="--p:75%">
                    <div class="text-content">Adobe<br>Illustrator</div>
                </div>
            </div>

            <div class="col expertise__item">
                <div class="circular-progress" style="--p:60%">
                    <div class="text-content">Adobe<br>Indesign</div>
                </div>
            </div>

            <div class="col expertise__item">
                <div class="circular-progress" style="--p:90%">
                    <div class="text-content">Power<br>Point</div>
                </div>
            </div>
        </div>
    </div>
</section>
